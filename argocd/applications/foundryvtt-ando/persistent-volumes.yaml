kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: "backup-lh"
spec:
  storageClassName: "longhorn"
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: "10Gi"

---

kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: "container-cache-lh"
spec:
  storageClassName: "longhorn"
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: "1Gi"

---

kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: "data"
spec:
  storageClassName: "microk8s-hostpath"
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: "20Gi"

---

kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: "load-lh"
spec:
  storageClassName: "longhorn"
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: "10Gi"

